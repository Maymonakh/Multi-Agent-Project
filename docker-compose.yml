services:
  redis:
    image: redis:7-alpine

  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./documents:/app/documents
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
